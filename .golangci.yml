# golangci-lint configuration for remote-sdk-go
# Configuration compatible with golangci-lint v2.5.0
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - gocyclo
    - goconst
    - whitespace
  exclusions:
    rules:
      # Test files routinely repeat fixture strings ("env", "bucket",
      # timestamps etc.) for self-contained readability. Skip goconst
      # there. Mirrors the same exclusion in dit-server and
      # dit-remote-server.
      - path: _test\.go
        linters:
          - goconst