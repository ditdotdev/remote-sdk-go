name: Cascade Dependency Updates
on:
  release:
    types: [published]

jobs:
  update-providers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - s3-remote-go
          - ssh-remote-go
          - s3web-remote-go
          - nop-remote-go
          - datadatdat-remote-go
    steps:
      - name: Checkout provider repo
        uses: actions/checkout@v4
        with:
          repository: datadatdat/${{ matrix.repo }}
          token: ${{ secrets.GO_MODULES_TOKEN }}
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      
      - name: Configure Git
        run: |
          git config --global user.name "datadatdat-bot"
          git config --global user.email "bot@datadatdat.com"
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
      
      - name: Update dependency
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Updating ${{ matrix.repo }} to use remote-sdk-go $VERSION"
          
          go get github.com/datadatdat/remote-sdk-go@$VERSION
          go mod tidy
          
          # Run tests to ensure compatibility
          go test ./...
      
      - name: Create Pull Request
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          BRANCH="auto-update-sdk-$VERSION"
          
          git checkout -b $BRANCH
          git add go.mod go.sum
          git commit -m "Update remote-sdk-go to $VERSION

Automated update triggered by remote-sdk-go $VERSION release.

- Updated dependency to $VERSION
- Ran go mod tidy
- All tests passing"
          
          git push origin $BRANCH
          
          gh pr create \
            --title "Update remote-sdk-go to $VERSION" \
            --body "## Automated Dependency Update

This PR updates \`remote-sdk-go\` to **$VERSION**.

### Changes
- Updated go.mod dependency
- Ran \`go mod tidy\`
- All tests passing ✅

### Next Steps
1. Review changes
2. Merge this PR
3. Tag and release ${{ matrix.repo }} $VERSION

**Triggered by**: remote-sdk-go $VERSION release" \
            --base master \
            --head $BRANCH
        env:
          GH_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
