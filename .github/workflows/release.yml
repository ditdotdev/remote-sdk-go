# Copyright Datadatdat.
#

#
# When a tag is pushed, build, test, and publish a release immediately.
# Tests must pass before the release is created.
#
name: Release

on: create

permissions:
  contents: write

jobs:
  health:
    uses: datadatdat/.github/.github/workflows/repo-health.yml@master
    with:
      language: go
      coverage-floor: 90
      mode: block
    secrets:
      GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}

  release:
    name: Build and Release
    needs: health
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get Version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Get Binary Name
        id: binary_name
        run: |
          chmod +x ./.github/get-binary-name
          ./.github/get-binary-name echo ${{ runner.os }}
      - name: Build
        run: go build -o build/echo ./cmd/echo
        env:
          GOPRIVATE: github.com/datadatdat/*
      - name: Test
        run: go test ./...
        env:
          GOPRIVATE: github.com/datadatdat/*
      - name: Create Release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" ./build/echo \
            --title "Release $TAG_NAME" \
            --notes "Release $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
  
  update-providers:
    name: Update Provider (${{ matrix.repo }})
    needs: [health, release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - s3-remote-go
          - ssh-remote-go
          - s3web-remote-go
          - nop-remote-go
          - datadatdat-remote-go
    steps:
      - name: Checkout provider repo
        uses: actions/checkout@v6
        with:
          repository: datadatdat/${{ matrix.repo }}
          token: ${{ secrets.GO_MODULES_TOKEN }}
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
      
      - name: Configure Git
        run: |
          git config --global user.name "datadatdat-bot"
          git config --global user.email "bot@datadatdat.com"
          git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
      
      - name: Update dependency
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          echo "Updating ${{ matrix.repo }} to use remote-sdk-go $VERSION"
          
          # Clear go module cache to avoid stale auth issues
          go clean -modcache
          
          go get github.com/datadatdat/remote-sdk-go@$VERSION
          go mod tidy
          go test ./...
        env:
          GOPRIVATE: github.com/datadatdat/*
          GIT_TERMINAL_PROMPT: 0
      
      - name: Create Pull Request
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          BRANCH="auto-update-sdk-$VERSION"
          
          git checkout -b $BRANCH
          git add go.mod go.sum
          git commit -m "Update remote-sdk-go to $VERSION"
          git push origin $BRANCH
          
          gh pr create \
            --title "Update remote-sdk-go to $VERSION" \
            --body "Automated update from remote-sdk-go $VERSION release" \
            --base master \
            --head $BRANCH
        env:
          GH_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
