#
# When a tag is pushed, build, test, and publish a release immediately.
# Tests must pass before the release is created.
#
name: Release

on: create

permissions:
  contents: write

jobs:
  upload:
    name: Build and Upload
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Get Binary Name
        id: binary_name
        run: |
          chmod +x ./.github/get-binary-name
          ./.github/get-binary-name echo ${{ runner.os }}
      - name: Build
        run: go build -o build/echo ./cmd/echo
        env:
          GOPRIVATE: github.com/datadatdat/*
      - name: Test
        run: go test ./...
        env:
          GOPRIVATE: github.com/datadatdat/*
      - name: Create Release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" ./build/echo \
            --title "Release $TAG_NAME" \
            --notes "Release $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
