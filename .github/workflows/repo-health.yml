name: Repo Health

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]

jobs:
  health:
    # NOTE: pinned to chore/repo-health-workflow for the rollout PR.
    # Will be updated to @master once datadatdat/.github PR #4 merges.
    uses: datadatdat/.github/.github/workflows/repo-health.yml@chore/repo-health-workflow
    with:
      language: go
      coverage-floor: 70
      max-cyclomatic: 25
      mode: warn
    secrets:
      GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
