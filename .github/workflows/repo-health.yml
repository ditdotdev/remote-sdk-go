name: Repo Health

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]

jobs:
  health:
    # NOTE: pinned to chore/repo-health-workflow for the rollout PR.
    # Will be updated to @master once datadatdat/.github PR #4 merges.
    uses: datadatdat/.github/.github/workflows/repo-health.yml@chore/repo-health-workflow
    with:
      language: go
      coverage-floor: 70
      max-cyclomatic: 25
      mode: warn
      # The remote/ tests load a plugin binary at ../build/echo (relative to
      # the package). Build it before running tests so coverage measurement
      # reflects actual test passes, not crashes from a missing fixture.
      pre-test: |
        mkdir -p build
        go build -o build/echo ./cmd/echo
    secrets:
      GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
